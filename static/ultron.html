<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT ULTRON - AI Core Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-base: #030712;
            --panel-bg: rgba(6, 11, 25, 0.6);
            --border-dim: rgba(0, 229, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --cyan: #00e5ff;
            --cyan-dim: rgba(0, 229, 255, 0.15);
            --red: #ff2a55;
            --font-ui: 'Rajdhani', sans-serif;
            --font-data: 'Share Tech Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.05) 0%, transparent 50%),
                linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        /* HEADER & NAV */
        header {
            height: 70px;
            border-bottom: 1px solid var(--border-dim);
            background: rgba(5, 10, 20, 0.9);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: relative;
            z-index: 10;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo-icon { font-size: 28px; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
        .logo-text h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; line-height: 1.1; margin:0; }
        
        .header-nav { display: flex; gap: 10px; }
        .nav-link {
            text-decoration: none; color: var(--text-dim); padding: 8px 15px;
            font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px;
            border: 1px solid transparent; border-radius: 4px; transition: 0.3s;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--cyan); border-color: var(--cyan-dim); background: rgba(0, 229, 255, 0.05);
            text-shadow: 0 0 5px var(--cyan);
        }

        /* MAIN CONTENT */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* ULTRON FACE / CORE */
        .ultron-core-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        /* Outer spinning rings */
        .core-ring-1 {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            border: 2px solid rgba(0, 229, 255, 0.2); border-top-color: var(--cyan); border-bottom-color: var(--cyan);
            animation: spin 8s linear infinite;
        }
        .core-ring-2 {
            position: absolute; width: 85%; height: 85%; border-radius: 50%;
            border: 2px dashed rgba(0, 229, 255, 0.4);
            animation: spin-reverse 15s linear infinite;
        }
        .core-ring-3 {
            position: absolute; width: 115%; height: 115%; border-radius: 50%;
            border: 1px solid rgba(0, 229, 255, 0.1); border-left-color: var(--cyan);
            animation: spin 12s linear infinite;
        }

        /* The Face Image */
        .ultron-face {
            width: 200px; height: 200px; border-radius: 50%;
            background: url('wireframe_face.jpg') center/cover;
            border: 2px solid var(--cyan);
            box-shadow: 0 0 30px var(--cyan-dim), 0 0 100px rgba(0,229,255,0.1) inset;
            position: relative;
            overflow: hidden;
            filter: hue-rotate(180deg) brightness(1.2); /* Make it cyan */
            transition: all 0.2s ease-out;
        }

        /* Speaking animation overlay */
        .ultron-face.speaking {
            box-shadow: 0 0 50px var(--cyan), 0 0 100px rgba(0,229,255,0.4) inset;
            filter: hue-rotate(180deg) brightness(1.5) contrast(1.2);
            border-color: #fff;
        }
        
        .ultron-face::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 20%;
            background: linear-gradient(180deg, transparent, rgba(0,229,255,0.5), transparent);
            animation: scanline 3s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        @keyframes scanline { 0% { top: -20%; } 100% { top: 100%; } }

        /* CHAT INTERFACE */
        .chat-container {
            width: 800px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .chat-display {
            background: var(--panel-bg);
            border: 1px solid var(--border-dim);
            border-radius: 8px;
            padding: 20px;
            height: 200px;
            overflow-y: auto;
            font-size: 16px;
            line-height: 1.6;
            color: var(--cyan);
            text-shadow: 0 0 5px rgba(0,229,255,0.3);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .chat-msg {
            margin-bottom: 10px;
            padding-left: 15px;
            border-left: 2px solid var(--cyan);
            animation: fadein 0.5s ease;
        }
        .chat-msg.user {
            color: var(--text-dim);
            border-left-color: var(--text-dim);
            text-shadow: none;
            text-align: right;
            padding-left: 0;
            padding-right: 15px;
            border-left: none;
            border-right: 2px solid var(--text-dim);
        }

        @keyframes fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* INPUT BAR */
        .input-bar {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .mic-btn {
            width: 60px; height: 60px; border-radius: 50%;
            background: rgba(0,229,255,0.1); border: 2px solid var(--cyan);
            color: var(--cyan); font-size: 24px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 0 15px rgba(0,229,255,0.2);
        }
        .mic-btn:hover {
            background: var(--cyan); color: #000; box-shadow: 0 0 25px var(--cyan);
        }
        .mic-btn.listening {
            background: var(--red); border-color: var(--red); color: white;
            box-shadow: 0 0 30px var(--red);
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 20px var(--red); }
            50% { transform: scale(1.1); box-shadow: 0 0 40px var(--red); }
            100% { transform: scale(1); box-shadow: 0 0 20px var(--red); }
        }

        .text-input {
            flex: 1;
            background: rgba(0,0,0,0.5); border: 1px solid var(--border-dim);
            border-radius: 30px; padding: 0 25px; height: 60px;
            color: white; font-family: var(--font-ui); font-size: 18px;
            outline: none; transition: 0.3s;
        }
        .text-input:focus { border-color: var(--cyan); box-shadow: 0 0 15px var(--cyan-dim); }

    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <i class="fa-solid fa-layer-group logo-icon"></i>
            <div class="logo-text"><h1>PROJECT ULTRON</h1></div>
        </div>
        <nav class="header-nav">
            <a href="index.html" class="nav-link"><i class="fa-solid fa-border-all"></i> OVERVIEW</a>
            <a href="threat_map.html" class="nav-link"><i class="fa-solid fa-map-location-dot"></i> THREAT MAP</a>
            <a href="sensors.html" class="nav-link"><i class="fa-solid fa-tower-broadcast"></i> SENSORS</a>
            <a href="reasoning.html" class="nav-link"><i class="fa-solid fa-brain"></i> REASONING</a>
            <a href="response.html" class="nav-link"><i class="fa-solid fa-shield-halved"></i> RESPONSE</a>
            <a href="ultron.html" class="nav-link active"><i class="fa-solid fa-microphone-lines"></i> AI CORE</a>
        </nav>
        <div style="color:var(--cyan); font-family:var(--font-data); font-size:12px;">GEMINI API: <span style="color:var(--green);">CONNECTED</span></div>
    </header>

    <main>
        <div class="ultron-core-container">
            <div class="core-ring-1"></div>
            <div class="core-ring-2"></div>
            <div class="core-ring-3"></div>
            <div class="ultron-face" id="ultron-face"></div>
        </div>

        <div class="chat-container">
            <div class="chat-display" id="chat-display">
                <div class="chat-msg">System initialized. Gemini AI link established. Awaiting your command, operator.</div>
            </div>
            <div class="input-bar">
                <div class="mic-btn" id="mic-btn" title="Hold to Speak"><i class="fa-solid fa-microphone"></i></div>
                <input type="text" class="text-input" id="text-input" placeholder="Type or speak your command...">
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const micBtn = document.getElementById('mic-btn');
            const textInput = document.getElementById('text-input');
            const chatDisplay = document.getElementById('chat-display');
            const ultronFace = document.getElementById('ultron-face');
            
            // Text to speech setup
            const synth = window.speechSynthesis;
            function speak(text) {
                if (synth.speaking) {
                    synth.cancel(); // Stop current speech if any
                }
                const utterThis = new SpeechSynthesisUtterance(text);
                utterThis.rate = 1.1;
                utterThis.pitch = 0.8;
                
                let voices = synth.getVoices();
                if(voices.length) {
                    let bestVoice = voices.find(v => v.name.includes('Google UK English Male') || v.name.includes('Microsoft Mark') || v.name.includes('English'));
                    if(bestVoice) utterThis.voice = bestVoice;
                }
                
                utterThis.onstart = () => { ultronFace.classList.add('speaking'); };
                utterThis.onend = () => { ultronFace.classList.remove('speaking'); };
                
                synth.speak(utterThis);
            }

            function addMessage(text, isUser=false) {
                const div = document.createElement('div');
                div.className = 'chat-msg ' + (isUser ? 'user' : '');
                div.innerHTML = `<strong>${isUser ? 'OPERATOR' : 'ULTRON'}:</strong> ${text}`;
                chatDisplay.appendChild(div);
                chatDisplay.scrollTop = chatDisplay.scrollHeight;
            }

            // Speech to text setup
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            let recognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                
                recognition.onstart = function() {
                    micBtn.classList.add('listening');
                    textInput.placeholder = "Listening...";
                };
                
                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    textInput.value = transcript;
                    sendMessage(transcript);
                };
                
                recognition.onerror = function(event) {
                    micBtn.classList.remove('listening');
                    textInput.placeholder = "Type or speak your command...";
                };
                
                recognition.onend = function() {
                    micBtn.classList.remove('listening');
                };
            }

            micBtn.addEventListener('click', () => {
                if (recognition) {
                    try { recognition.start(); } catch(e) {}
                } else {
                    alert("Speech recognition not supported in this browser.");
                }
            });
            
            textInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const text = textInput.value.trim();
                    if (text) sendMessage(text);
                }
            });

            async function sendMessage(text) {
                addMessage(text, true);
                textInput.value = "";
                textInput.placeholder = "Ultron is thinking...";
                
                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text })
                    });
                    const data = await response.json();
                    
                    if (data.reply) {
                        addMessage(data.reply, false);
                        if (data.voice_brief) {
                            speak(data.voice_brief);
                        }
                    }
                } catch (error) {
                    addMessage("Error communicating with AI Core. Check API key and backend connection.", false);
                } finally {
                    textInput.placeholder = "Type or speak your command...";
                }
            }
        });
    </script>
</body>
</html>
